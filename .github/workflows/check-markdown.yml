name: check-markdown
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Report-only: check every finding in all *.md files (not just the
      # diff), but never fail the job. Rules in .vale.ini, vocabulary in
      # .vale/styles/config/vocabularies/Docs/accept.txt.
      # On pull requests, findings on changed lines become review comments
      # (with suggested fixes); the rest stay check annotations. On push
      # there is no PR to review, so everything stays a check annotation.
      - name: Lint the Markdown files with Vale
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          files: all
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          filter_mode: nofilter
          fail_on_error: false
